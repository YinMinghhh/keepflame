# Safe example only. Enroll and sign into a dedicated profile before a real run.
[storage]
path = "../var/keepflame-browser.sqlite3"

[[flames]]
id = "joinquant-primary"
keeper = "joinquant"
account_id = "primary"
enabled = false

[flames.schedule]
timezone = "Asia/Shanghai"
first_check = "09:00"
recheck_minutes = 60
reminder_at = "20:00"
stop_at = "23:00"

[flames.settings]
mode = "browser"
browser_profile_dir = "/absolute/path/outside/repos/keepflame/profiles/primary"
browser_headless = false

# Email delivery exists and stays off. This example is not a live mailbox.
[notify.email]
enabled = false
host = "smtp.example.invalid"
port = 587
security = "starttls"
username = "keepflame@example.invalid"
password_file = "/absolute/path/to/smtp.password"
from = "keepflame@example.invalid"
to = ["operator@example.invalid"]
timeout_seconds = 15
