[storage]
path = "/var/lib/keepflame/keepflame.sqlite3"

[[flames]]
id = "joinquant-primary"
keeper = "joinquant"
account_id = "primary"
enabled = false

[flames.schedule]
timezone = "Asia/Shanghai"
first_check = "09:00"
# Or a random daily start instead of first_check:
# first_window_start = "09:00"
# first_window_end = "11:00"
# retry_minutes = [30, 60, 120]
# Network-only failures (no HTTP response) use a separate daily budget instead of retry_minutes:
# transport_failure_cap = 6       # 0 disables it (network failures then use retry_minutes)
# transport_retry_minutes = 10
recheck_minutes = 60
reminder_at = "20:00"
stop_at = "23:00"

[flames.settings]
# This file is mounted read-only by compose.yaml and contains only the raw
# Cookie header value. Never put the value itself in this TOML file.
cookie_file = "/run/secrets/joinquant.cookie"

# Email delivery exists and stays off. This example is not a live mailbox.
[notify.email]
enabled = false
host = "smtp.example.invalid"
port = 587
security = "starttls"
username = "keepflame@example.invalid"
password_file = "/run/secrets/smtp.password"
from = "keepflame@example.invalid"
to = ["operator@example.invalid"]
timeout_seconds = 15

# Slack delivery exists and stays off. This example holds no real webhook address.
[notify.slack]
enabled = false
webhook_file = "/run/secrets/slack-webhook.url"
timeout_seconds = 15

