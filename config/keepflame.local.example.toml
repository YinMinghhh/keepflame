[storage]
# Relative paths resolve from this configuration file's directory.
path = "../var/keepflame.sqlite3"

[[flames]]
id = "joinquant-primary"
keeper = "joinquant"
account_id = "primary"
enabled = true

[flames.schedule]
timezone = "Asia/Shanghai"
first_check = "09:00"
recheck_minutes = 60
reminder_at = "20:00"
stop_at = "23:00"

[flames.settings]
cookie_file = "/absolute/path/to/joinquant.cookie"

