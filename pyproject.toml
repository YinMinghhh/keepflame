[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "keepflame"
version = "0.1.0"
description = "Maintain recurring external-service states without hiding human intervention."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.51,<2", "Pillow>=11,<13", "numpy>=2.2,<3"]

[project.scripts]
keepflame = "keepflame.cli:main"

[project.entry-points."keepflame.keepers"]
joinquant = "keepflame.flames.joinquant:create_keeper"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

